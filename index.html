<style>
  * { box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; }

  .login { max-width: 360px; margin: 100px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .login h2 { margin-top: 0; color: #2c7a7b; text-align: center; }

  textarea { min-height: 150px; resize: vertical; font-family: inherit; }

  .tabs button.active { background: #2c7a7b; color: #fff; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #edf2f7; }

  .badge.active { background: #c6f6d5; color: #22543d; }
  .badge.passive { background: #fed7d7; color: #742a2a; }
  .actions button { width: auto; padding: 6px 12px; font-size: 12px; margin-right: 4px; }
  .error { color: #c53030; text-align: center; min-height: 20px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  h3 { color: #2c7a7b; margin-top: 0; }
  .diet-box { white-space: pre-wrap; background: #f7fafc; padding: 16px; border-radius: 8px; border-left: 4px solid #2c7a7b; }

  .modal { background: #fff; padding: 24px; border-radius: 10px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }

  @media (max-width: 768px) {

<body>
<div id="app"></div>

<script>
// ---------- Cift tiklama korumasi (gonder/kaydet butonlari) ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.busy === '1') {
    e.preventDefault();
    e.stopImmediatePropagation();
    return;
  }
  b.dataset.busy = '1';
  const prevOpacity = b.style.opacity;
  const prevCursor = b.style.cursor;
  b.disabled = true;
  b.style.opacity = '.6';
  b.style.cursor = 'wait';
  setTimeout(() => {
    if (!document.body.contains(b)) return;
    delete b.dataset.busy;
    b.disabled = false;
    b.style.opacity = prevOpacity;
    b.style.cursor = prevCursor;
  }, 1200);
}, true);

// ---------- Ana ekrana ekle (PWA install) ----------
let deferredInstallPrompt = null;
let bannerShown = false;
const DISMISS_DAYS = 3;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => {
  const ua = navigator.userAgent;
  if (/iphone|ipad|ipod/i.test(ua)) return true;
  // iPad iOS 13+ reports as MacIntel with touch
  return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
};
const isAndroid = () => /android/i.test(navigator.userAgent);
const dismissedRecently = () => {
  const ts = parseInt(localStorage.getItem('diyet_install_dismissed_ts')||'0',10);
  if (!ts) return false;
  return (Date.now() - ts) < DISMISS_DAYS * 86400000;
};
const browserInstallHint = () => {
  const ua = navigator.userAgent;
  if (/SamsungBrowser/i.test(ua)) return 'Sağ alttaki menüden <b>"Sayfayı ekle → Ana Ekran"</b> seçin.';
  if (/Firefox/i.test(ua)) return 'Sağ üstteki ⋮ menüden <b>"Ana ekrana ekle"</b> seçin.';
  if (/Edg/i.test(ua)) return 'Sağ alttaki ⋯ menüden <b>"Telefona ekle"</b> seçin.';
  return 'Tarayıcı menüsünden (⋮ veya ⋯) <b>"Ana ekrana ekle"</b> / <b>"Uygulamayı yükle"</b> seçeneğini seçin.';
};

function showInstallBanner(kind) {
  if (bannerShown) return;
  if (document.getElementById('installBanner')) return;
  if (isStandalone()) return;
  if (dismissedRecently()) return;
  bannerShown = true;
  const div = document.createElement('div');
  div.id = 'installBanner';
  div.style.cssText = 'position:fixed;left:10px;right:10px;bottom:14px;z-index:9999;background:#fff;border:2px solid #2c7a7b;border-radius:12px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;font-family:Segoe UI,Arial,sans-serif;max-width:520px;margin:0 auto';
  if (kind === 'prompt') {
    div.innerHTML = '<div style="font-size:28px">📲</div>'
      + '<div style="flex:1;font-size:13px;color:#2d3748;line-height:1.4"><b>Uygulamayı ana ekrana eklemek ister misiniz?</b><br>Tek dokunuşla erişin, bildirim alın.</div>'
      + '<button id="installYes" style="background:#2c7a7b;color:#fff;border:none;border-radius:6px;padding:10px 14px;font-weight:600;cursor:pointer">Evet</button>'
      + '<button id="installNo" style="background:#e2e8f0;color:#2d3748;border:none;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer">Hayır</button>';
  } else if (kind === 'ios') {
    div.innerHTML = '<div style="font-size:28px">📲</div>'
      + '<div style="flex:1;font-size:13px;color:#2d3748;line-height:1.4"><b>Ana ekrana eklemek ister misiniz?</b><br>Safari\'de alttaki <b>Paylaş</b> ⬆️ tuşuna basıp <b>"Ana Ekrana Ekle"</b> seçin.</div>'
      + '<button id="installNo" style="background:#2c7a7b;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer">Tamam</button>';
  } else {
    // manual instructions fallback (Android browsers that don't fire beforeinstallprompt)
    div.innerHTML = '<div style="font-size:28px">📲</div>'
      + '<div style="flex:1;font-size:13px;color:#2d3748;line-height:1.4"><b>Ana ekrana eklemek ister misiniz?</b><br>' + browserInstallHint() + '</div>'
      + '<button id="installNo" style="background:#2c7a7b;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer">Tamam</button>';
  }
  document.body.appendChild(div);
  const close = () => { try { div.remove(); } catch(e) {} bannerShown = false; };
  const noBtn = document.getElementById('installNo');
  if (noBtn) noBtn.onclick = () => { localStorage.setItem('diyet_install_dismissed_ts', String(Date.now())); close(); };
  const yesBtn = document.getElementById('installYes');
  if (yesBtn) yesBtn.onclick = async () => {
    if (!deferredInstallPrompt) { close(); return; }
    try {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      if (choice.outcome === 'accepted') localStorage.setItem('diyet_install_dismissed_ts', String(Date.now()));
    } catch(e) {}
    deferredInstallPrompt = null;
    close();
  };
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  setTimeout(() => showInstallBanner('prompt'), 600);
});
window.addEventListener('appinstalled', () => {
  localStorage.setItem('diyet_install_dismissed_ts', String(Date.now()));
  const b = document.getElementById('installBanner'); if (b) b.remove();
  bannerShown = false;
});
window.addEventListener('load', () => {
  setTimeout(() => {
    if (isStandalone()) return;
    if (bannerShown) return;
    if (isIOS()) { showInstallBanner('ios'); return; }
    // If beforeinstallprompt didn't fire by now (Android Firefox/Samsung etc), show manual hint
    if (!deferredInstallPrompt && isAndroid()) { showInstallBanner('manual'); return; }
    // Desktop / other: also offer manual hint
    if (!deferredInstallPrompt) showInstallBanner('manual');
  }, 2500);
});

// ---------- Service Worker (mobil bildirim icin) ----------
let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    if ('periodicSync' in reg) {
      navigator.permissions.query({ name: 'periodic-background-sync' }).then(s => {
        if (s.state === 'granted') {
          reg.periodicSync.register('check-notifications', { minInterval: 15 * 60 * 1000 }).catch(()=>{});
        }
      }).catch(()=>{});
    }
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'sw-check-notifications') {
      db = DB.load();
      if (session) {
        if (session.role === 'client') fireClientNotifications();
        else fireDietitianNotifications();
      }
    }
  });
}

function showSystemNotification(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  try {
    if (swReg && swReg.active) {
      swReg.active.postMessage({ type: 'show-notification', title, body, tag });
      return true;
    }
    const n = new Notification(title, { body, tag, vibrate: [200,100,200] });
    n.onclick = () => { window.focus(); n.close(); };
    return true;
  } catch(e) { return false; }
}

// ---------- Auto-update ----------
const APP_VERSION = '1.1.0';
(function checkAppVersion() {
  const stored = localStorage.getItem('diyet_app_version');
  if (stored !== APP_VERSION) {
    localStorage.setItem('diyet_app_version', APP_VERSION);
    if (stored !== null && 'caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(()=>{});
    }
  }
})();
async function checkForUpdate() {
  try {
    const res = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const html = await res.text();
    const m = html.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if (m && m[1] !== APP_VERSION) {
      if ('caches' in window) {
        try { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } catch(e) {}
      }
      location.reload();
    }
  } catch(e) {}
}
window.addEventListener('load', () => setTimeout(checkForUpdate, 1500));
window.addEventListener('focus', checkForUpdate);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
setInterval(checkForUpdate, 60 * 1000); // her 1 dakikada bir kontrol

// Service Worker güncelleme kontrolu
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.update().catch(()=>{}));
  });
  setInterval(() => {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.update().catch(()=>{}));
    });
  }, 5 * 60 * 1000);
}

// ---------- Storage ----------
const DB = {
  load() {
    const d = JSON.parse(localStorage.getItem('diyet_db') || 'null');
    if (d) return d;
    const init = {
      dietitian: { username: 'dytaysenur', password: 'ozenduran' },
      clients: [],   // {id, username, password, name, active}
      diets: [],     // {id, clientId, title, content, date}
      weights: [],   // {id, clientId, weight, date}
      templates: [] // {id, title, content}
    };
    localStorage.setItem('diyet_db', JSON.stringify(init));
    return init;
  },
  save(d) { localStorage.setItem('diyet_db', JSON.stringify(d)); }
};

let db = DB.load();
function ensureDefaults() {
  if (!db) db = {};
  if (!db.dietitian) db.dietitian = { username: 'dytaysenur', password: 'ozenduran' };
  if (!db.clients) db.clients = [];
  if (!db.diets) db.diets = [];
  if (!db.weights) db.weights = [];
  if (!db.templates) db.templates = [];
  if (!db.dietitianNotifications) db.dietitianNotifications = [];
  if (!db.surveys) db.surveys = [];
  if (!db.tests) db.tests = [];
  if (!db.tetkikRequests) db.tetkikRequests = [];
  if (!db.tetkikResults) db.tetkikResults = [];
  if (!db.notificationsLog) db.notificationsLog = [];
  if (db.dietitian && db.dietitian.username === 'admin' && db.dietitian.password === 'admin') {
    db.dietitian = { username: 'dytaysenur', password: 'ozenduran' };
  }
}
ensureDefaults();
DB.save(db);

// ---------- Firebase / Firestore sync ----------
const firebaseConfig = {
  apiKey: "AIzaSyAqPQkXsgLZaloEnVlh-T1NLgkJpkAB4tI",
  authDomain: "diyetisyen-5bbaf.firebaseapp.com",
  projectId: "diyetisyen-5bbaf",
  storageBucket: "diyetisyen-5bbaf.firebasestorage.app",
  messagingSenderId: "1080384039240",
  appId: "1:1080384039240:web:c7cc7e66d29020756dab7d",
  measurementId: "G-P993GFHSSH"
};
let fsdb = null, FS_DOC = null, fsSaveTimer = null, fsPendingWrite = false, fsLastWriteAt = 0, fsReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  fsdb = firebase.firestore();
  FS_DOC = fsdb.collection('app').doc('state');
} catch(e) { console.error('Firebase init failed', e); }

function showFsError(msg) {
  let bar = document.getElementById('fsErrBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'fsErrBar';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c53030;color:#fff;padding:10px 14px;font-family:Segoe UI,Arial,sans-serif;font-size:13px;z-index:99999;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.2)';
    document.body.appendChild(bar);
  }
  bar.textContent = '⚠️ Firebase hatası: ' + msg + ' — (Firestore Rules açık mı?)';
}
function clearFsError() {
  const bar = document.getElementById('fsErrBar');
  if (bar) bar.remove();
}

// Firestore: undefined, NaN, nested-array-in-array yasak. Recursive temizleyici.
function sanitizeForFs(v) {
  if (v === undefined || v === null) return null;
  if (typeof v === 'number') { if (!isFinite(v)) return null; return v; }
  if (typeof v === 'string' || typeof v === 'boolean') return v;
  if (typeof v === 'function' || typeof v === 'symbol') return null;
  if (Array.isArray(v)) {
    return v.map(item => {
      if (Array.isArray(item)) {
        // Firestore izinli degil: array icinde array. Object ile sar.
        return { _arr: item.map(sanitizeForFs) };
      }
      const s = sanitizeForFs(item);
      return s === undefined ? null : s;
    }).filter(x => x !== undefined);
  }
  if (typeof v === 'object') {
    const out = {};
    for (const k in v) {
      if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
      const sv = sanitizeForFs(v[k]);
      if (sv !== undefined) out[k] = sv;
    }
    return out;
  }
  return null;
}
// Geri yukleme sirasinda _arr sarmasini geri ac
function unwrapFromFs(v) {
  if (v === null || typeof v !== 'object') return v;
  if (Array.isArray(v)) return v.map(unwrapFromFs);
  if (v._arr && Array.isArray(v._arr) && Object.keys(v).length === 1) return v._arr.map(unwrapFromFs);
  const out = {};
  for (const k in v) out[k] = unwrapFromFs(v[k]);
  return out;
}

function pushToFirestore() {
  if (!FS_DOC || !db) return;
  if (fsSaveTimer) clearTimeout(fsSaveTimer);
  fsSaveTimer = setTimeout(() => {
    fsPendingWrite = true;
    fsLastWriteAt = Date.now();
    let payload;
    try { payload = sanitizeForFs(db); }
    catch(e) { showFsError('Veri serileştirilemedi: ' + e.message); fsPendingWrite = false; return; }
    // 950 KB üzerinde uyari (Firestore tek doc limiti 1 MB)
    try {
      const sz = JSON.stringify(payload).length;
      if (sz > 950000) {
        showFsError('Veri boyutu çok büyük (' + Math.round(sz/1024) + ' KB). Büyük tetkik dosyalarını silin.');
      }
    } catch(e) {}
    FS_DOC.set(payload).then(() => clearFsError()).catch(e => {
      console.error('Firestore set', e);
      showFsError((e && e.code ? e.code + ' — ' : '') + (e && e.message ? e.message : 'bilinmeyen hata'));
    }).finally(() => {
      setTimeout(() => { fsPendingWrite = false; }, 600);
    });
  }, 500);
}

// Wrap DB.save to also push to Firestore
const _origDbSave = DB.save.bind(DB);
DB.save = function(d) { _origDbSave(d); pushToFirestore(); };

// Render erteleme: modal acik veya kullanici input'ta yaziyorsa otomatik render yapma
let pendingRenderCheck = null;
function isInteractionActive() {
  if (document.querySelector('.modal-bg')) return true;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) return true;
  return false;
}
function schedulePendingRender() {
  if (pendingRenderCheck) return;
  pendingRenderCheck = setInterval(() => {
    if (!isInteractionActive()) {
      clearInterval(pendingRenderCheck); pendingRenderCheck = null;
      if (typeof render === 'function') try { render(); } catch(e) {}
    }
  }, 1500);
}

// Initial load + realtime listener
if (FS_DOC) {
  FS_DOC.get().then(snap => {
    if (snap.exists) {
      db = unwrapFromFs(snap.data());
      ensureDefaults();
      _origDbSave(db);
      fsReady = true;
      if (typeof render === 'function') try { render(); } catch(e) {}
    } else {
      FS_DOC.set(JSON.parse(JSON.stringify(db))).then(()=>clearFsError()).catch(e => {
        console.error('Firestore initial set', e);
        showFsError((e && e.code ? e.code + ' — ' : '') + (e && e.message ? e.message : 'ilk yazim hatasi'));
      });
      fsReady = true;
    }
  }).catch(e => {
    console.error('Firestore get', e);
    showFsError((e && e.code ? e.code + ' — ' : '') + (e && e.message ? e.message : 'okuma hatasi'));
    fsReady = true;
  });

  FS_DOC.onSnapshot(snap => {
    if (!snap.exists) return;
    // Skip echo of our own writes
    if (fsPendingWrite || (Date.now() - fsLastWriteAt < 1500)) return;
    const newDb = unwrapFromFs(snap.data());
    if (!newDb) return;
    db = newDb;
    ensureDefaults();
    _origDbSave(db);
    // Modal acik veya kullanici input/textarea'da yaziyorsa render'i ertele

    if (typeof render === 'function') try { render(); } catch(e) {}
  }, e => console.error('Firestore snapshot', e));
}

const fmtShortDate = ts => {
  const d = new Date(ts);
  return ('0'+d.getDate()).slice(-2) + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + d.getFullYear();
};
function getClientSchedule(c) {
  const diets = db.diets.filter(d=>d.clientId===c.id).sort((a,b)=>a.date-b.date);
  if (!diets.length) return null;
  const start = diets[0].date;
  const periodDays = parseInt(c.period||'0',10);
  if (!periodDays) return { start, next:null, periodDays:0 };
  const now = Date.now();
  let next = start + periodDays * 86400000;
  while (next < now) next += periodDays * 86400000;
  return { start, next, periodDays };
}
function headerScheduleHtml(c) {
  const s = getClientSchedule(c);
  if (!s) return '<div style="font-size:12px;color:#cbd5e0">Diyet henüz başlamadı</div>';
  const startStr = fmtShortDate(s.start);
  const nextStr = s.next ? fmtShortDate(s.next) : '—';
  return `<div style="font-size:12px;color:#e6fffa;line-height:1.4;text-align:right">
    <div>📅 Başlangıç: <b>${startStr}</b></div>
    <div>🔄 Sonraki Kontrol: <b>${nextStr}</b></div>
    <div>⚖️ Sonraki Kilo Takibi: <b>${nextStr}</b></div>
  </div>`;
}
function dietitianScheduleSummary() {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayTs = today.getTime();
  let overdue = 0, todayCnt = 0;
  db.clients.filter(c=>c.active).forEach(c => {
    const s = getClientSchedule(c);
    if (!s || !s.next) return;
    const d = new Date(s.next); d.setHours(0,0,0,0);
    if (d.getTime() === todayTs) todayCnt++;
    else if (d.getTime() < todayTs) overdue++;
  });
  return `<div style="font-size:12px;color:#e6fffa;line-height:1.4;text-align:right">
    <div>📅 ${fmtShortDate(Date.now())}</div>
    <div>🔄 Bugün kontrol: <b>${todayCnt}</b> · Geciken: <b>${overdue}</b></div>
  </div>`;
}

function doLogin() {
  const u = $('#u').value.trim();
  const p = $('#p').value;
  const keep = $('#keepOpen') && $('#keepOpen').checked;
  localStorage.setItem('diyet_keep_open', keep ? '1' : '0');
  if (u === db.dietitian.username && p === db.dietitian.password) {
    session = { role: 'dietitian' };
    persistSession();
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().then(() => fireDietitianNotifications());
    } else {
      setTimeout(fireDietitianNotifications, 500);
    }
    render();
    return;
  }
  const c = db.clients.find(x => x.username === u && x.password === p);
  if (!c) { $('#err').textContent = 'Kullanıcı adı veya şifre hatalı'; return; }
  if (!c.active) { $('#err').textContent = 'Hesabınız pasif durumda. Diyetisyeninize başvurun.'; return; }
  session = { role: 'client', clientId: c.id, loginAt: Date.now() };
  persistSession();
  c.lastSeen = Date.now();
  c.onlineUntil = Date.now() + 45000;
  save();
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(() => fireClientNotifications());
  } else {
    setTimeout(fireClientNotifications, 500);
  }
  render();
}

function fireClientNotifications() {
  if (!session || session.role !== 'client') return;
  const c = db.clients.find(x=>x.id===session.clientId);
  if (!c || !c.notifications || !c.notifications.length) return;
  if (!('Notification' in window)) { c.notifications = []; save(); return; }

    c.notifications = [];
    save();
  }
}

let heartbeatTimer = null, dietitianRefreshTimer = null;
function startHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => {
    if (!session || session.role !== 'client') { clearInterval(heartbeatTimer); heartbeatTimer = null; return; }
    const TEN_DAYS = 10 * 24 * 60 * 60 * 1000;
    if (session.loginAt && (Date.now() - session.loginAt) > TEN_DAYS) {
      const cc = db.clients.find(x=>x.id===session.clientId);
      if (cc) { cc.onlineUntil = 0; save(); }
      session = null; localStorage.removeItem('diyet_session');
      clearInterval(heartbeatTimer); heartbeatTimer = null;
      alert('10 günlük oturum süresi doldu. Lütfen tekrar giriş yapın.');
      render();
      return;
    }
    db = DB.load();
    const c = db.clients.find(x=>x.id===session.clientId);
    if (!c) return;
    c.lastSeen = Date.now();
    c.onlineUntil = Date.now() + 45000;
    save();
    fireClientNotifications();
  }, 20000);
}
function startDietitianRefresh() {
  if (dietitianRefreshTimer) clearInterval(dietitianRefreshTimer);
  dietitianRefreshTimer = setInterval(() => {
    if (!session || session.role !== 'dietitian') { clearInterval(dietitianRefreshTimer); dietitianRefreshTimer = null; return; }

          <button class="secondary" id="cancelEdit">İptal</button>

      <textarea id="dContent" placeholder="Diyet programını buraya yazın...&#10;&#10;Sabah: ...&#10;Ara öğün: ...&#10;Öğle: ...&#10;..."></textarea>
      <h3 style="margin-top:20px">Danışan Seç</h3>

        <tbody>${sent}</tbody>

    ${sentModal}`;
}

function templatesTab() {
  const editing = view.editTemplateId ? db.templates.find(t=>t.id===view.editTemplateId) : null;
  const mode = view.tplMode || (editing && editing.fileName ? 'pdf' : 'text');
  const rows = db.templates.map(t => {
    const isPdf = !!t.fileName;
    const preview = isPdf ? `📎 ${t.fileName}` : ((t.content||'').slice(0,60).replace(/</g,'&lt;')+((t.content||'').length>60?'…':''));
    return `<tr>
      <td>${isPdf?'📄 PDF':'📝 Metin'}</td>
      <td>${t.title}</td>
      <td style="color:#718096;font-size:12px">${preview}</td>
      <td class="actions">
        <button data-sendt="${t.id}">📤 Gönder</button>
        ${isPdf?`<a href="${t.fileData}" download="${t.fileName}"><button class="secondary" type="button">İndir</button></a>`:''}
        <button class="secondary" data-editt="${t.id}">Düzenle</button>
        <button class="danger" data-delt="${t.id}">Sil</button>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="4" style="text-align:center;color:#718096">Henüz hazır diyet yok</td></tr>`;

  let sendModal = '';
  if (view.sendTemplateId) {
    const t = db.templates.find(x=>x.id===view.sendTemplateId);
    const opts = db.clients.filter(c=>c.active).map(c =>
      `<label><input type="checkbox" class="tplClient" value="${c.id}"/> ${c.name} (${c.username})</label>`
    ).join('') || '<p style="color:#718096">Aktif danışan yok</p>';
    sendModal = `<div class="modal-bg"><div class="modal">
      <h3>${t.title} - Danışan Seç</h3>
      <div class="multi-select">${opts}</div>
      <div class="row" style="margin-top:10px">
        <button id="confirmSendTpl">📤 Gönder</button>
        <button class="secondary" id="cancelSendTpl">İptal</button>
      </div>
      <div class="error" id="tplSendErr"></div>
    </div></div>`;
  }

  const tabBtn = (m, label) => `<button class="${mode===m?'':'secondary'}" data-tplmode="${m}" style="width:auto;padding:8px 14px;margin:0">${label}</button>`;
  const existingFile = editing && editing.fileName ? `<p style="color:#4a5568;font-size:13px;margin:4px 0">Mevcut dosya: <a href="${editing.fileData}" download="${editing.fileName}" style="color:#2c7a7b">📎 ${editing.fileName}</a></p>` : '';
  const formBody = mode === 'pdf'
    ? `<input id="tTitle" placeholder="Diyet Başlığı" value="${editing ? editing.title.replace(/"/g,'&quot;') : ''}" />
       ${existingFile}
       <input id="tFile" type="file" accept="application/pdf" style="padding:8px" />
       <p style="color:#718096;font-size:12px;margin:4px 0">PDF dosyası seçin (max 5MB)</p>`
    : `<input id="tTitle" placeholder="Diyet Başlığı" value="${editing ? editing.title.replace(/"/g,'&quot;') : ''}" />
       <textarea id="tContent" placeholder="Diyet içeriği...">${editing ? (editing.content||'').replace(/</g,'&lt;') : ''}</textarea>`;
  return `
    <div class="card">
      <h3>${editing ? 'Diyeti Düzenle' : 'Yeni Diyet Ekle'}</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${tabBtn('text','📝 Diyet Ekle (Elle Yaz)')} ${tabBtn('pdf','📄 PDF Ekle')}
      </div>
      ${formBody}
      <div class="row">
        <button id="saveTemplate">${editing ? 'Güncelle' : 'Kaydet'}</button>
        ${editing ? '<button class="secondary" id="cancelEditTpl">İptal</button>' : ''}

      <div class="error" id="tErr"></div>
    </div>
    <div class="card">
      <h3>Hazır Diyetler</h3>
      <table>
        <thead><tr><th>Tip</th><th>Başlık</th><th>Önizleme</th><th>İşlem</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${sendModal}`;
}

function clientDetailView() {
  const c = db.clients.find(x=>x.id===view.detailClientId);

  const diets = db.diets.filter(d=>d.clientId===c.id).sort((a,b)=>b.date-a.date);
  const ws = db.weights.filter(w=>w.clientId===c.id).sort((a,b)=>b.date-a.date);

  const dietRows = diets.map(d=>`<tr><td>${fmtDate(d.date)}</td><td>${d.title}</td><td class="actions"><button data-viewdd="${d.id}">Görüntüle</button> <button class="danger" data-deldd="${d.id}">Sil</button></td></tr>`).join('')
    || `<tr><td colspan="3" style="text-align:center;color:#718096">Diyet yok</td></tr>`;
  const tests = (db.tests||[]).filter(t=>t.clientId===c.id).sort((a,b)=>b.date-a.date);

    <td>${fmtDate(t.date)}</td>

  // Yeni tetkik (Anket sekmesinden gönderilenler) + danışandan gelen sonuçlar
  const tetReqs = (db.tetkikRequests||[]).filter(r=>r.clientId===c.id).sort((a,b)=>b.date-a.date);
  const tetReqRows = tetReqs.map(r=>`<tr>
    <td>${fmtDate(r.date)}</td>
    <td>${r.tests.length} tahlil</td>
    <td>${(r.note||'').slice(0,60).replace(/</g,'&lt;')}${(r.note||'').length>60?'…':''}</td>

      <button class="danger" data-deltetr="${r.id}">Sil</button>
    </td>
  </tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:#718096">Tetkik isteği gönderilmedi</td></tr>`;

  const tetRes = (db.tetkikResults||[]).filter(r=>r.clientId===c.id).sort((a,b)=>b.date-a.date);
  const tetResRows = tetRes.map(r=>`<tr>
    <td>${fmtDate(r.date)}</td>
    <td>${r.fileName}</td>
    <td class="actions">
      <a href="${r.dataUrl}" download="${r.fileName}" style="display:inline-block;background:#4a5568;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:600">İndir</a>
      ${r.fileType && r.fileType.startsWith('image/') ? `<button data-viewres="${r.id}">Görüntüle</button>` : ''}
      <button class="danger" data-delres="${r.id}">Sil</button>
    </td>
  </tr>`).join('') || `<tr><td colspan="3" style="text-align:center;color:#718096">Henüz sonuç gelmedi</td></tr>`;

  let wSummary = '';
  if (ws.length) {
    const vals = ws.map(w=>w.weight);
    const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    const min = Math.min(...vals).toFixed(1), max = Math.max(...vals).toFixed(1);
    const sorted = ws.slice().sort((a,b)=>a.date-b.date);
    const diff = (sorted[sorted.length-1].weight - sorted[0].weight).toFixed(1);
    const dc = diff>0?'#c53030':diff<0?'#22543d':'#718096';
    wSummary = `<div style="background:#f7fafc;padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:13px;color:#4a5568">
      ${ws.length} kayıt · Ort: <b>${avg}</b> · Min: ${min} · Max: ${max} · Değişim: <b style="color:${dc}">${diff>0?'+':''}${diff} kg</b>
    </div>`;
  }
  const wRows = ws.map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${w.weight} kg</td><td class="actions"><button class="danger" data-delw="${w.id}">Sil</button></td></tr>`).join('')
    || `<tr><td colspan="3" style="text-align:center;color:#718096">Kilo kaydı yok</td></tr>`;

  const surveyRows = surveys.map(s=>`<tr>
    <td>${fmtDate(s.date)}</td>
    <td>${s.completedDate?'<span class="badge active">Tamamlandı</span>':'<span class="badge passive">Bekliyor</span>'}</td>
    <td class="actions">${s.completedDate?`<button data-vs="${s.id}">Yanıtları Gör</button> `:''}<button class="danger" data-dels="${s.id}">Sil</button></td>
  </tr>`).join('') || `<tr><td colspan="3" style="text-align:center;color:#718096">Anket yok</td></tr>`;

  let viewSurveyModal = '';
  if (view.viewSurveyId) {
    const s = db.surveys.find(x=>x.id===view.viewSurveyId);
    if (s) {
      const rows = s.questions.map(qid => {
        const q = SURVEY_QUESTIONS.find(x=>x.id===qid); if (!q) return '';
        const a = s.answers && s.answers[qid]; let val = '-';
        if (a) val = q.type==='yesno' ? ((a.value==='evet'?'Evet':'Hayır') + (a.detail?' — '+a.detail:'')) : (a.value || '-');
        return `<tr><td style="width:55%">${q.text}</td><td>${(''+val).replace(/</g,'&lt;')}</td></tr>`;
      }).join('');
      viewSurveyModal = `<div class="modal-bg"><div class="modal" style="max-width:640px">
        <h3>Anket Yanıtları</h3>
        <p style="color:#718096;font-size:12px">Tamamlanma: ${fmtDate(s.completedDate)}</p>
        <table>${rows}</table>
        <button id="closeSurveyView" style="margin-top:14px">Kapat</button>
      </div></div>`;
    }
  }

  let dietViewModal = '';
  if (view.viewDietId) {
    const d = db.diets.find(x=>x.id===view.viewDietId);
    if (d) {
      const body = d.fileName
        ? `<p><a href="${d.fileData}" download="${d.fileName}" style="color:#2c7a7b;font-weight:600">📎 ${d.fileName}</a></p>
           <iframe src="${d.fileData}" style="width:100%;height:60vh;border:1px solid #e2e8f0;border-radius:8px"></iframe>`
        : `<div class="diet-box">${(d.content||'').replace(/</g,'&lt;')}</div>`;
      dietViewModal = `<div class="modal-bg"><div class="modal" style="max-width:720px">
        <h3>${d.title}</h3>
        <p style="color:#718096;font-size:12px">${fmtDate(d.date)}</p>
        ${body}
        <button id="closeDietView" style="margin-top:14px">Kapat</button>
      </div></div>`;
    }
  }

  let testViewModal = '';
  if (view.viewTestId) {
    const t = (db.tests||[]).find(x=>x.id===view.viewTestId);
    if (t) testViewModal = `<div class="modal-bg"><div class="modal">
      <h3>${t.title}</h3>
      <p style="color:#718096;font-size:12px">${fmtDate(t.date)}</p>
      <div class="diet-box">${(t.content||'').replace(/</g,'&lt;')}</div>
      ${t.fileName?`<p style="margin-top:10px"><a href="${t.fileData}" download="${t.fileName}" style="color:#2c7a7b">📎 ${t.fileName}</a></p>`:''}
      <button id="closeTestView" style="margin-top:14px">Kapat</button>
    </div></div>`;
  }

  return `
    <button class="secondary" id="backFromDetail" style="width:auto;margin-bottom:12px">← Danışan Listesi</button>
    <div class="card">
      <h3>👤 ${c.name} ${online?'<span style="margin-left:8px;font-size:13px;color:#22543d">🟢 Çevrimiçi</span>':''}</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:14px">
        <div><b>Telefon:</b> ${c.phone||'-'}</div>
        <div><b>Kullanıcı:</b> ${c.username}</div>
        <div><b>Şifre:</b> ${c.password}</div>
        <div><b>Periyot:</b>
          <select data-period="${c.id}" style="margin:0;padding:4px;width:auto">
            <option value="">-</option>
            <option value="10" ${c.period==='10'?'selected':''}>10 Günlük</option>
            <option value="15" ${c.period==='15'?'selected':''}>15 Günlük</option>
            <option value="30" ${c.period==='30'?'selected':''}>Aylık</option>
          </select>
        </div>
        <div><b>Ödeme:</b>
          <select data-payment="${c.id}" style="margin:0;padding:4px;width:auto;background:${c.payment==='alindi'?'#c6f6d5':c.payment==='odemedi'?'#fed7d7':'#fff'};font-weight:600">
            <option value="">-</option>
            <option value="alindi" ${c.payment==='alindi'?'selected':''}>Alındı</option>
            <option value="odemedi" ${c.payment==='odemedi'?'selected':''}>Ödeme Yapmadı</option>
          </select>
        </div>
        <div><b>Durum:</b> ${c.active?'<span class="badge active">Aktif</span>':'<span class="badge passive">Pasif</span>'}</div>
        <div><b>Son Görülme:</b> ${c.lastSeen?fmtDate(c.lastSeen):'-'}</div>
      </div>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px">
        <button data-edit="${c.id}" style="width:auto;padding:8px 14px">✏️ Düzenle</button>
        <button class="warn" data-toggle="${c.id}" style="width:auto;padding:8px 14px">${c.active?'Pasif Yap':'Aktif Yap'}</button>
        <button class="danger" data-del="${c.id}" style="width:auto;padding:8px 14px">🗑️ Sil</button>
      </div>
    </div>

    <div class="card">
      <h3>📋 Gönderilen Diyetler (${diets.length})</h3>

      <table><thead><tr><th>Tarih</th><th>Başlık</th><th>İşlem</th></tr></thead><tbody>${dietRows}</tbody></table>
    </div>

    <div class="card">
      <h3>⚖️ Kilo Kayıtları (${ws.length})</h3>
      ${wSummary}
      <table><thead><tr><th>Tarih</th><th>Kilo</th><th>İşlem</th></tr></thead><tbody>${wRows}</tbody></table>
    </div>

    <div class="card">

    <div class="card">
      <h3>📥 Danışandan Gelen Sonuçlar (${tetRes.length})</h3>
      <table><thead><tr><th>Tarih</th><th>Dosya</th><th>İşlem</th></tr></thead><tbody>${tetResRows}</tbody></table>
    </div>

    <div class="card">
      <h3>🧪 Ekstra Tetkik / Not (${tests.length})</h3>
      <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px">

    <div class="card">
      <h3>📋 Anketler (${surveys.length})</h3>
      <table><thead><tr><th>Tarih</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${surveyRows}</tbody></table>
    </div>

    ${dietViewModal}
    ${viewSurveyModal}
    ${testViewModal}
    ${(() => {
      if (!view.viewTetkikResultId) return '';
      const r = (db.tetkikResults||[]).find(x=>x.id===view.viewTetkikResultId);
      if (!r || !r.fileType || !r.fileType.startsWith('image/')) return '';
      return `<div class="modal-bg"><div class="modal" style="max-width:720px">

      return `<div class="modal-bg"><div class="modal">
        <h3>Danışanı Düzenle</h3>
        <input id="eName" placeholder="Ad Soyad" value="${(ec.name||'').replace(/"/g,'&quot;')}" />
        <input id="ePhone" placeholder="Telefon Numarası" value="${(ec.phone||'').replace(/"/g,'&quot;')}" />
        <div class="row">
          <input id="eUser" placeholder="Kullanıcı Adı" value="${(ec.username||'').replace(/"/g,'&quot;')}" />
          <input id="ePass" placeholder="Şifre" value="${(ec.password||'').replace(/"/g,'&quot;')}" />
        </div>
        <div class="row" style="margin-top:8px">
          <button id="saveEditClient">Kaydet</button>
          <button class="secondary" id="cancelEditClient">İptal</button>

        <div class="error" id="eErr"></div>
      </div></div>`;
    })()}`;
}

function weightsTab() {
  const list = db.clients.map(c => `
    <tr>
      <td>${c.name}</td>
      <td>${db.weights.filter(w=>w.clientId===c.id).length} kayıt</td>
      <td class="actions"><button data-vw="${c.id}">Kiloları Gör</button></td>
    </tr>`).join('') || `<tr><td colspan="3" style="text-align:center;color:#718096">Danışan yok</td></tr>`;

  let detail = '';
  if (view.weightClientId) {
    const c = db.clients.find(x=>x.id===view.weightClientId);
    const ws = db.weights.filter(w=>w.clientId===view.weightClientId).sort((a,b)=>b.date-a.date);
    const mode = view.weightGroup || 'all';
    let body = '';
    if (!ws.length) {
      body = `<table><thead><tr><th>Tarih</th><th>Kilo</th><th>İşlem</th></tr></thead><tbody><tr><td colspan="3" style="text-align:center;color:#718096">Kayıt yok</td></tr></tbody></table>`;
    } else if (mode === 'all') {
      const vals = ws.map(w=>w.weight);
      const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
      const min = Math.min(...vals).toFixed(1);
      const max = Math.max(...vals).toFixed(1);
      const sorted = ws.slice().sort((a,b)=>a.date-b.date);
      const diff = (sorted[sorted.length-1].weight - sorted[0].weight).toFixed(1);
      const diffColor = diff > 0 ? '#c53030' : diff < 0 ? '#22543d' : '#718096';
      const rows = ws.map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${w.weight} kg</td><td class="actions"><button class="danger" data-delw="${w.id}">Sil</button></td></tr>`).join('');
      body = `<div style="background:#f7fafc;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#4a5568">
          ${ws.length} kayıt · Ort: <b>${avg}</b> · Min: ${min} · Max: ${max} ·
          Değişim: <b style="color:${diffColor}">${diff>0?'+':''}${diff} kg</b>
        </div>
        <table><thead><tr><th>Tarih</th><th>Kilo</th><th>İşlem</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else {
      const groups = {};
      const keyOf = (d) => {
        const dt = new Date(d);
        if (mode === 'month') {
          return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
        }
        const tmp = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
        const day = tmp.getUTCDay() || 7;
        tmp.setUTCDate(tmp.getUTCDate() + 4 - day);
        const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
        const wk = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
        return tmp.getUTCFullYear() + '-H' + String(wk).padStart(2,'0');
      };
      const labelOf = (d, k) => {
        const dt = new Date(d);
        if (mode === 'month') {
          return dt.toLocaleDateString('tr-TR', { year:'numeric', month:'long' });
        }
        const day = dt.getDay() || 7;
        const monday = new Date(dt); monday.setDate(dt.getDate() - (day-1));
        const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
        const fmt = x => x.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});
        return k.split('-H')[1] + '. Hafta ('+fmt(monday)+' - '+fmt(sunday)+')';
      };
      ws.forEach(w => {
        const k = keyOf(w.date);
        if (!groups[k]) groups[k] = { label: labelOf(w.date, k), items: [] };
        groups[k].items.push(w);
      });
      const keys = Object.keys(groups).sort().reverse();
      body = keys.map(k => {
        const g = groups[k];
        const vals = g.items.map(i=>i.weight);
        const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
        const min = Math.min(...vals).toFixed(1);
        const max = Math.max(...vals).toFixed(1);
        const sorted = g.items.slice().sort((a,b)=>a.date-b.date);
        const diff = (sorted[sorted.length-1].weight - sorted[0].weight).toFixed(1);
        const diffColor = diff > 0 ? '#c53030' : diff < 0 ? '#22543d' : '#718096';
        const rows = g.items.map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${w.weight} kg</td><td class="actions"><button class="danger" data-delw="${w.id}">Sil</button></td></tr>`).join('');
        return `<div style="border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px;overflow:hidden">
          <div style="background:#f7fafc;padding:10px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
            <strong style="color:#2c7a7b">${g.label}</strong>
            <span style="font-size:13px;color:#4a5568">
              ${g.items.length} kayıt · Ort: <b>${avg}</b> · Min: ${min} · Max: ${max} ·
              Değişim: <b style="color:${diffColor}">${diff>0?'+':''}${diff} kg</b>
            </span>
          </div>
          <table style="margin:0"><thead><tr><th>Tarih</th><th>Kilo</th><th>İşlem</th></tr></thead><tbody>${rows}</tbody></table>
        </div>`;
      }).join('');
    }
    const btn = (m, label) => `<button class="${mode===m?'':'secondary'}" data-wg="${m}" style="width:auto;padding:8px 14px;margin:0">${label}</button>`;
    detail = `<div class="card">
      <h3>${c?c.name:''} - Kilo Geçmişi</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        ${btn('all','Tümü')} ${btn('week','Haftalık')} ${btn('month','Aylık')}
      </div>
      ${body}
      <button class="secondary" id="closeW" style="width:auto;margin-top:10px">Kapat</button>
    </div>`;
  }

  return `
    <div class="card">
      <h3>Danışan Kilo Takibi</h3>
      <table>
        <thead><tr><th>Danışan</th><th>Kayıt Sayısı</th><th>İşlem</th></tr></thead>
        <tbody>${list}</tbody>
      </table>
    </div>
    ${detail}`;
}

        <button id="uploadResult" style="margin-top:8px">📤 Gönder</button>

    </div>
    ${dietModal}
    ${surveyModal}
    ${tetkikModal}`;
}

// ---------- Events ----------
function bindEvents() {
  if (!session) {
    $('#loginBtn').onclick = doLogin;
    $('#p').onkeydown = e => { if (e.key==='Enter') doLogin(); };
    $('#togglePw').onclick = () => {
      const p = $('#p');
      p.type = p.type === 'password' ? 'text' : 'password';
      $('#togglePw').textContent = p.type === 'password' ? '👁️' : '🙈';
    };
    $('#keepOpen').onchange = () => {
      localStorage.setItem('diyet_keep_open', $('#keepOpen').checked ? '1' : '0');
    };
    return;
  }
  if ($('#appTitle')) $('#appTitle').onclick = () => location.reload();
  $('#logout').onclick = () => {
    if (session.role === 'client') {
      const c = db.clients.find(x=>x.id===session.clientId);
      if (c) { c.lastSeen = Date.now(); c.onlineUntil = 0; save(); }
    }
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    if (dietitianRefreshTimer) { clearInterval(dietitianRefreshTimer); dietitianRefreshTimer = null; }
    session = null; localStorage.removeItem('diyet_session'); view = {tab:'clients',selectedClientId:null,weightClientId:null}; render();
  };
  if (session.role === 'client' && !heartbeatTimer) startHeartbeat();
  if (session.role === 'dietitian' && !dietitianRefreshTimer) startDietitianRefresh();

  // Notification bell + modal
  if ($('#bellBtn')) $('#bellBtn').onclick = () => {
    const t = myLogTarget();
    (db.notificationsLog||[]).forEach(n => { if (n.target===t) n.read = true; });
    save(); view.showNotifications = true; render();
  };
  if ($('#closeNotif')) $('#closeNotif').onclick = () => { view.showNotifications = false; render(); };
  document.querySelectorAll('[data-deln]').forEach(b => b.onclick = () => {
    db.notificationsLog = (db.notificationsLog||[]).filter(n=>n.id!==b.dataset.deln); save(); render();
  });
  if ($('#delAllNotif')) $('#delAllNotif').onclick = () => {
    if (!confirm('Tüm bildirimler silinsin mi?')) return;
    const t = myLogTarget();
    db.notificationsLog = (db.notificationsLog||[]).filter(n=>n.target!==t); save(); render();
  };

  // Password change (client only)
  if ($('#changePwBtn')) $('#changePwBtn').onclick = () => { view.showChangePw = true; render(); };
  if ($('#cancelPw')) $('#cancelPw').onclick = () => { view.showChangePw = false; render(); };
  if ($('#savePw')) $('#savePw').onclick = () => {
    const c = db.clients.find(x=>x.id===session.clientId);
    const oldP = $('#oldPw').value, n1 = $('#newPw').value, n2 = $('#newPw2').value;
    if (!c) return;
    if (oldP !== c.password) { $('#pwErr').textContent = 'Mevcut şifre yanlış'; return; }
    if (n1.length < 4) { $('#pwErr').textContent = 'Yeni şifre en az 4 karakter olmalı'; return; }
    if (n1 !== n2) { $('#pwErr').textContent = 'Yeni şifreler eşleşmiyor'; return; }
    c.password = n1; save(); view.showChangePw = false; alert('Şifre değiştirildi'); render();
  };

  if (session.role === 'dietitian') {
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { view.tab = b.dataset.tab; view.weightClientId=null; view.detailClientId=null; render(); });

    if (view.detailClientId) {
      const cid = view.detailClientId;
      if ($('#backFromDetail')) $('#backFromDetail').onclick = () => { view.detailClientId = null; view.viewDietId = null; view.viewSurveyId = null; view.viewTestId = null; render(); };
      document.querySelectorAll('[data-viewdd]').forEach(b => b.onclick = () => { view.viewDietId = b.dataset.viewdd; render(); });
      if ($('#closeDietView')) $('#closeDietView').onclick = () => { view.viewDietId = null; render(); };
      document.querySelectorAll('[data-vs]').forEach(b => b.onclick = () => { view.viewSurveyId = b.dataset.vs; render(); });
      if ($('#closeSurveyView')) $('#closeSurveyView').onclick = () => { view.viewSurveyId = null; render(); };
      document.querySelectorAll('[data-viewtt]').forEach(b => b.onclick = () => { view.viewTestId = b.dataset.viewtt; render(); });
      if ($('#closeTestView')) $('#closeTestView').onclick = () => { view.viewTestId = null; render(); };

      // Tetkik request/result handlers (detail panel)
      document.querySelectorAll('[data-tetpdfd]').forEach(b => b.onclick = () => downloadTetkikPdf(b.dataset.tetpdfd));
      document.querySelectorAll('[data-deltetr]').forEach(b => b.onclick = () => {
        if (!confirm('Tetkik isteği silinsin mi?')) return;
        db.tetkikRequests = (db.tetkikRequests||[]).filter(r=>r.id!==b.dataset.deltetr); save(); render();
      });
      document.querySelectorAll('[data-viewres]').forEach(b => b.onclick = () => { view.viewTetkikResultId = b.dataset.viewres; render(); });
      document.querySelectorAll('[data-delres]').forEach(b => b.onclick = () => {
        if (!confirm('Sonuç silinsin mi?')) return;
        db.tetkikResults = (db.tetkikResults||[]).filter(r=>r.id!==b.dataset.delres); save(); render();
      });
      if ($('#closeResView')) $('#closeResView').onclick = () => { view.viewTetkikResultId = null; render(); };
      if ($('#quickSendTetkik')) $('#quickSendTetkik').onclick = () => {
        const dup = (db.tetkikRequests||[]).some(r => r.clientId===cid);
        if (dup && !confirm('Bu danışana daha önce tetkik gönderdiniz. Tekrar gönderilsin mi?')) return;
        const allTests = TETKIK_TESTS.map((_,i) => i);
        db.tetkikRequests.push({id:uid(), clientId:cid, tests:allTests, note:DEFAULT_TETKIK_NOTE, date:Date.now()});
        queueNotification(cid, '🧪 Yeni Tetkik İsteği', 'Diyetisyeniniz size kan tahlili istedi.');
        save(); render();
      };

      document.querySelectorAll('[data-deldd]').forEach(b => b.onclick = () => {
        if (!confirm('Diyet silinsin mi?')) return;
        db.diets = db.diets.filter(d=>d.id!==b.dataset.deldd); save(); render();
      });
      document.querySelectorAll('[data-delw]').forEach(b => b.onclick = () => {
        if (!confirm('Kilo kaydı silinsin mi?')) return;
        db.weights = db.weights.filter(w=>w.id!==b.dataset.delw); save(); render();
      });
      document.querySelectorAll('[data-dels]').forEach(b => b.onclick = () => {
        if (!confirm('Anket silinsin mi?')) return;
        db.surveys = db.surveys.filter(s=>s.id!==b.dataset.dels); save(); render();
      });
      document.querySelectorAll('[data-deltt]').forEach(b => b.onclick = () => {
        if (!confirm('Tetkik silinsin mi?')) return;
        db.tests = (db.tests||[]).filter(t=>t.id!==b.dataset.deltt); save(); render();
      });

      document.querySelectorAll('[data-period]').forEach(s => s.onchange = () => {
        const cc = db.clients.find(x=>x.id===s.dataset.period); cc.period = s.value; save();
      });
      document.querySelectorAll('[data-payment]').forEach(s => s.onchange = () => {
        const cc = db.clients.find(x=>x.id===s.dataset.payment); cc.payment = s.value; save(); render();
      });
      document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
        const cc = db.clients.find(x=>x.id===b.dataset.toggle); cc.active = !cc.active; save(); render();
      });
      document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { view.editClientId = b.dataset.edit; render(); });
      if ($('#cancelEditClient')) $('#cancelEditClient').onclick = () => { view.editClientId = null; render(); };
      if ($('#saveEditClient')) $('#saveEditClient').onclick = () => {
        const cc = db.clients.find(x=>x.id===view.editClientId); if (!cc) return;
        const name = $('#eName').value.trim(), phone = $('#ePhone').value.trim(), u = $('#eUser').value.trim(), p = $('#ePass').value.trim();
        if (!name || !phone || !u || !p) { $('#eErr').textContent='Tüm alanları doldurun'; return; }
        if (u !== cc.username && (u === db.dietitian.username || db.clients.find(x=>x.username===u))) { $('#eErr').textContent='Bu kullanıcı adı zaten kullanılıyor'; return; }
        cc.name = name; cc.phone = phone; cc.username = u; cc.password = p;
        view.editClientId = null; save(); render();
      };
      document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
        if (!confirm('Danışan ve tüm verileri silinecek. Emin misiniz?')) return;
        const id = b.dataset.del;
        db.clients = db.clients.filter(x=>x.id!==id);
        db.diets = db.diets.filter(d=>d.clientId!==id);
        db.weights = db.weights.filter(w=>w.clientId!==id);
        db.surveys = (db.surveys||[]).filter(s=>s.clientId!==id);
        db.tests = (db.tests||[]).filter(t=>t.clientId!==id);
        view.detailClientId = null; save(); render();
      });

      if ($('#quickSendDiet')) $('#quickSendDiet').onclick = () => {
        const title = prompt('Diyet başlığı:'); if (!title) return;
        const content = prompt('Diyet içeriği:'); if (!content) return;
        db.diets.push({id:uid(), clientId:cid, title, content, date:Date.now()});
        queueNotification(cid, '🥗 Yeni Diyet Programı', title);
        save(); render();
      };

      if ($('#addTest')) $('#addTest').onclick = () => {
        const title = $('#testTitle').value.trim();
        const content = $('#testContent').value.trim();
        const fileInput = $('#testFile');
        if (!title) { $('#testErr').textContent='Başlık gerekli'; return; }
        const finish = (fileName, fileData) => {
          if (!db.tests) db.tests = [];
          db.tests.push({id:uid(), clientId:cid, title, content, fileName, fileData, date:Date.now()});
          queueNotification(cid, '🧪 Yeni Tetkik', title);
          save(); render();
        };
        if (fileInput && fileInput.files && fileInput.files[0]) {
          const f = fileInput.files[0];
          if (f.size > 3 * 1024 * 1024) { $('#testErr').textContent='Dosya 3MB üzeri olamaz'; return; }
          const fr = new FileReader();
          fr.onload = () => finish(f.name, fr.result);
          fr.onerror = () => { $('#testErr').textContent='Dosya okunamadı'; };
          fr.readAsDataURL(f);
        } else {
          finish(null, null);
        }
      };
      return;
    }

    if (view.tab === 'clients') {
      const trMap = {ç:'c',Ç:'c',ğ:'g',Ğ:'g',ı:'i',İ:'i',ö:'o',Ö:'o',ş:'s',Ş:'s',ü:'u',Ü:'u'};
      const slug = s => s.toLowerCase().replace(/[çÇğĞıİöÖşŞüÜ]/g, m=>trMap[m]).replace(/[^a-z0-9]/g,'');
      if ($('#openAddClient')) $('#openAddClient').onclick = () => { view.showAddClient = true; render(); };
      if ($('#cancelAddClient')) $('#cancelAddClient').onclick = () => { view.showAddClient = false; render(); };
      document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { view.editClientId = b.dataset.edit; render(); });
      document.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => { view.detailClientId = b.dataset.detail; render(); });
      if ($('#cancelEditClient')) $('#cancelEditClient').onclick = () => { view.editClientId = null; render(); };
      if ($('#saveEditClient')) $('#saveEditClient').onclick = () => {
        const c = db.clients.find(x=>x.id===view.editClientId); if (!c) return;
        const name = $('#eName').value.trim(), phone = $('#ePhone').value.trim(), u = $('#eUser').value.trim(), p = $('#ePass').value.trim();
        if (!name || !phone || !u || !p) { $('#eErr').textContent='Tüm alanları doldurun'; return; }
        if (u !== c.username && (u === db.dietitian.username || db.clients.find(x=>x.username===u))) { $('#eErr').textContent='Bu kullanıcı adı zaten kullanılıyor'; return; }
        c.name = name; c.phone = phone; c.username = u; c.password = p;
        view.editClientId = null; save(); render();
      };
      if ($('#cFirstName') && $('#cLastName')) {
        const autoFill = () => {
          const first = slug($('#cFirstName').value.trim());
          const last = slug($('#cLastName').value.trim().replace(/\s+/g,''));
          if (first && last) {
            $('#cUser').value = (first[0]||'') + last;
            $('#cPass').value = last;
          } else {
            $('#cUser').value = ''; $('#cPass').value = '';
          }
        };
        $('#cFirstName').oninput = autoFill;
        $('#cLastName').oninput = autoFill;
      }
      if ($('#addClient')) $('#addClient').onclick = () => {
        const firstName = $('#cFirstName').value.trim(), lastName = $('#cLastName').value.trim();
        const phone = $('#cPhone').value.trim(), u = $('#cUser').value.trim(), p = $('#cPass').value.trim();
        const name = firstName + ' ' + lastName;
        if (!firstName || !lastName || !phone || !u || !p) { $('#cErr').textContent='Tüm alanları doldurun'; return; }
        if (u === db.dietitian.username || db.clients.find(c=>c.username===u)) { $('#cErr').textContent='Bu kullanıcı adı zaten kullanılıyor'; return; }
        const newId = uid();
        db.clients.push({id:newId, name, firstName, lastName, phone, username:u, password:p, active:true});
        const sendSurvey = $('#cSendSurvey') && $('#cSendSurvey').checked;
        const sendTetkik = $('#cSendTetkik') && $('#cSendTetkik').checked;
        if (sendSurvey) {
          const qids = SURVEY_QUESTIONS.map(q => q.id);
          db.surveys.push({id:uid(), clientId:newId, questions:qids, answers:{}, date:Date.now(), completedDate:null});
          queueNotification(newId, '📋 Yeni Anket', 'Diyetisyeniniz size bir anket gönderdi. Lütfen doldurun.');
        }
        if (sendTetkik) {
          const allTests = TETKIK_TESTS.map((_,i) => i);
          db.tetkikRequests.push({id:uid(), clientId:newId, tests:allTests, note:DEFAULT_TETKIK_NOTE, date:Date.now()});
          queueNotification(newId, '🧪 Yeni Tetkik İsteği', 'Diyetisyeniniz size kan tahlili istedi.');
        }
        view.showAddClient = false;
        save(); render();
      };
      document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
        const c = db.clients.find(x=>x.id===b.dataset.toggle); c.active = !c.active; save(); render();
      });
      document.querySelectorAll('[data-period]').forEach(s => s.onchange = () => {
        const c = db.clients.find(x=>x.id===s.dataset.period); c.period = s.value; save();
      });
      document.querySelectorAll('[data-payment]').forEach(s => s.onchange = () => {
        const c = db.clients.find(x=>x.id===s.dataset.payment); c.payment = s.value; save(); render();
      });
      document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
        if (!confirm('Danışan ve tüm verileri silinecek. Emin misiniz?')) return;
        const id = b.dataset.del;
        db.clients = db.clients.filter(c=>c.id!==id);
        db.diets = db.diets.filter(d=>d.clientId!==id);
        db.weights = db.weights.filter(w=>w.clientId!==id);
        save(); render();
      });
    }

    if (view.tab === 'diet') {
      $('#sendDiet').onclick = () => {
        const title = $('#dTitle').value.trim(), content = $('#dContent').value.trim();
        const ids = [...document.querySelectorAll('.dietClient:checked')].map(x=>x.value);
        if (!title || !content) { $('#dErr').textContent='Başlık ve içerik gerekli'; return; }
        if (!ids.length) { $('#dErr').textContent='En az bir danışan seçin'; return; }
        const dupClients = ids.filter(cid => db.diets.some(d => d.clientId===cid && d.title===title && d.content===content))
          .map(cid => { const cc = db.clients.find(x=>x.id===cid); return cc?cc.name:''; }).filter(Boolean);
        if (dupClients.length) {
          const ok = confirm('Bu diyeti daha önce şu danışan(lar)a gönderdiniz:\n\n' + dupClients.join(', ') + '\n\nTekrar gönderilsin mi?');
          if (!ok) return;
        }
        ids.forEach(cid => {
          db.diets.push({id:uid(), clientId:cid, title, content, date:Date.now()});
          queueNotification(cid, '🥗 Yeni Diyet Programı', title);
        });
        save(); alert(ids.length+' danışana diyet gönderildi'); render();
      };
      document.querySelectorAll('[data-deldiet]').forEach(b => b.onclick = () => {
        if (!confirm('Diyet silinsin mi?')) return;
        db.diets = db.diets.filter(d=>d.id!==b.dataset.deldiet); save(); render();
      });
      document.querySelectorAll('[data-viewsent]').forEach(b => b.onclick = () => { view.viewSentId = b.dataset.viewsent; render(); });
      document.querySelectorAll('[data-editsent]').forEach(b => b.onclick = () => { view.editSentId = b.dataset.editsent; render(); });
      if ($('#closeView')) $('#closeView').onclick = () => { view.viewSentId = null; render(); };
      if ($('#cancelEdit')) $('#cancelEdit').onclick = () => { view.editSentId = null; render(); };
      if ($('#saveEdit')) $('#saveEdit').onclick = () => {
        const d = db.diets.find(x=>x.id===view.editSentId);
        const t = $('#eTitle').value.trim(), c = $('#eContent').value.trim();
        if (!t || !c) return alert('Başlık ve içerik gerekli');
        d.title = t; d.content = c;
        queueNotification(d.clientId, '✏️ Diyet Güncellendi', t);
        save(); view.editSentId = null; render();
      };
    }

    if (view.tab === 'templates') {
      document.querySelectorAll('[data-tplmode]').forEach(b => b.onclick = () => { view.tplMode = b.dataset.tplmode; render(); });
      $('#saveTemplate').onclick = () => {
        const title = $('#tTitle').value.trim();
        if (!title) { $('#tErr').textContent='Başlık gerekli'; return; }
        const editingT = view.editTemplateId ? db.templates.find(t=>t.id===view.editTemplateId) : null;
        const mode = view.tplMode || (editingT && editingT.fileName ? 'pdf' : 'text');
        const finish = (fileName, fileData, contentVal) => {
          if (editingT) {
            editingT.title = title;
            if (mode === 'pdf') {
              if (fileName) { editingT.fileName = fileName; editingT.fileData = fileData; }
              editingT.content = '';
            } else {
              editingT.content = contentVal || '';
              editingT.fileName = null; editingT.fileData = null;
            }
            view.editTemplateId = null;
          } else {
            if (mode === 'pdf') db.templates.push({id:uid(), title, content:'', fileName, fileData});
            else db.templates.push({id:uid(), title, content:contentVal});
          }
          view.tplMode = null;
          save(); render();
        };
        if (mode === 'pdf') {
          const fileInput = $('#tFile');
          const hasNewFile = fileInput && fileInput.files && fileInput.files[0];
          if (!hasNewFile && (!editingT || !editingT.fileName)) { $('#tErr').textContent='PDF dosyası seçin'; return; }
          if (!hasNewFile) { finish(null, null); return; }
          const f = fileInput.files[0];
          if (f.size > 5 * 1024 * 1024) { $('#tErr').textContent='Dosya 5MB üzeri olamaz'; return; }
          const fr = new FileReader();
          fr.onload = () => finish(f.name, fr.result);
          fr.onerror = () => { $('#tErr').textContent='Dosya okunamadı'; };
          fr.readAsDataURL(f);
        } else {
          const content = ($('#tContent') && $('#tContent').value.trim()) || '';
          if (!content) { $('#tErr').textContent='İçerik gerekli'; return; }
          finish(null, null, content);
        }
      };
      if ($('#cancelEditTpl')) $('#cancelEditTpl').onclick = () => { view.editTemplateId = null; render(); };
      document.querySelectorAll('[data-editt]').forEach(b => b.onclick = () => {
        view.editTemplateId = b.dataset.editt;
        const t = db.templates.find(x=>x.id===view.editTemplateId);
        view.tplMode = t && t.fileName ? 'pdf' : 'text';
        render();
      });
      document.querySelectorAll('[data-delt]').forEach(b => b.onclick = () => {
        if (!confirm('Hazır diyet silinsin mi?')) return;
        db.templates = db.templates.filter(t=>t.id!==b.dataset.delt); save(); render();
      });
      document.querySelectorAll('[data-sendt]').forEach(b => b.onclick = () => { view.sendTemplateId = b.dataset.sendt; render(); });
      if ($('#cancelSendTpl')) $('#cancelSendTpl').onclick = () => { view.sendTemplateId = null; render(); };
      if ($('#confirmSendTpl')) $('#confirmSendTpl').onclick = () => {
        const t = db.templates.find(x=>x.id===view.sendTemplateId);
        const ids = [...document.querySelectorAll('.tplClient:checked')].map(x=>x.value);
        if (!ids.length) { $('#tplSendErr').textContent='En az bir danışan seçin'; return; }
        const dupClients = ids.filter(cid => db.diets.some(d => d.clientId===cid && d.title===t.title && d.content===t.content))
          .map(cid => { const cc = db.clients.find(x=>x.id===cid); return cc?cc.name:''; }).filter(Boolean);
        if (dupClients.length) {
          const ok = confirm('Bu diyeti daha önce şu danışan(lar)a gönderdiniz:\n\n' + dupClients.join(', ') + '\n\nTekrar gönderilsin mi?');
          if (!ok) return;
        }
        ids.forEach(cid => {
          db.diets.push({id:uid(), clientId:cid, title:t.title, content:t.content||'', fileName:t.fileName||null, fileData:t.fileData||null, date:Date.now()});
          queueNotification(cid, '🥗 Yeni Diyet Programı', t.title);
        });
        save(); view.sendTemplateId = null; alert(ids.length+' danışana diyet gönderildi'); render();
      };
    }

    if (view.tab === 'surveys') {
      $('#sendSurvey').onclick = () => {
        const qids = [...document.querySelectorAll('.sq:checked')].map(x=>x.value);
        const ids = [...document.querySelectorAll('.sClient:checked')].map(x=>x.value);
        if (!qids.length) { $('#sErr').textContent='En az bir soru seçin'; return; }
        if (!ids.length) { $('#sErr').textContent='En az bir danışan seçin'; return; }
        ids.forEach(cid => {
          db.surveys.push({id:uid(), clientId:cid, questions:qids, answers:{}, date:Date.now(), completedDate:null});
          queueNotification(cid, '📋 Yeni Anket', 'Diyetisyeniniz size bir anket gönderdi. Lütfen doldurun.');
        });
        save(); alert(ids.length+' danışana anket gönderildi'); render();
      };
      document.querySelectorAll('[data-vs]').forEach(b => b.onclick = () => { view.viewSurveyId = b.dataset.vs; render(); });
      if ($('#closeSurveyView')) $('#closeSurveyView').onclick = () => { view.viewSurveyId = null; render(); };
      document.querySelectorAll('[data-dels]').forEach(b => b.onclick = () => {
        if (!confirm('Anket silinsin mi?')) return;
        db.surveys = db.surveys.filter(s=>s.id!==b.dataset.dels); save(); render();
      });

      // Tetkik handlers
      $('#sendTetkik').onclick = () => {
        const tests = [...document.querySelectorAll('.tetkikCheck:checked')].map(x=>parseInt(x.value,10));
        const ids = [...document.querySelectorAll('.tetkikClient:checked')].map(x=>x.value);
        const note = $('#tetkikNote').value.trim();
        if (!tests.length) { $('#tetErr').textContent='En az bir tetkik seçin'; return; }
        if (!ids.length) { $('#tetErr').textContent='En az bir danışan seçin'; return; }
        ids.forEach(cid => {
          db.tetkikRequests.push({id:uid(), clientId:cid, tests, note, date:Date.now()});
          queueNotification(cid, '🧪 Yeni Tetkik İsteği', 'Diyetisyeniniz size kan tahlili istedi.');
        });
        save(); alert(ids.length+' danışana tetkik gönderildi'); render();
      };
      document.querySelectorAll('[data-tetpdf]').forEach(b => b.onclick = () => downloadTetkikPdf(b.dataset.tetpdf));
      document.querySelectorAll('[data-deltet]').forEach(b => b.onclick = () => {
        if (!confirm('Tetkik silinsin mi?')) return;
        db.tetkikRequests = db.tetkikRequests.filter(r=>r.id!==b.dataset.deltet); save(); render();
      });
      document.querySelectorAll('[data-viewres]').forEach(b => b.onclick = () => { view.viewTetkikResultId = b.dataset.viewres; render(); });
      document.querySelectorAll('[data-delres]').forEach(b => b.onclick = () => {
        if (!confirm('Sonuç silinsin mi?')) return;
        db.tetkikResults = db.tetkikResults.filter(r=>r.id!==b.dataset.delres); save(); render();
      });
      if ($('#closeResView')) $('#closeResView').onclick = () => { view.viewTetkikResultId = null; render(); };
    }

    if (view.tab === 'weights') {
      document.querySelectorAll('[data-vw]').forEach(b => b.onclick = () => { view.weightClientId = b.dataset.vw; view.weightGroup = 'all'; render(); });
      document.querySelectorAll('[data-wg]').forEach(b => b.onclick = () => { view.weightGroup = b.dataset.wg; render(); });
      document.querySelectorAll('[data-delw]').forEach(b => b.onclick = () => {
        if (!confirm('Bu kilo kaydı silinsin mi?')) return;
        db.weights = db.weights.filter(w=>w.id!==b.dataset.delw); save(); render();
      });
      if ($('#closeW')) $('#closeW').onclick = () => { view.weightClientId = null; view.weightGroup = 'all'; render(); };
    }
  } else {
    $('#addW').onclick = () => {
      const v = parseFloat($('#newW').value);
      if (!v || v <= 0) return alert('Geçerli bir kilo girin');
      db.weights.push({id:uid(), clientId:session.clientId, weight:v, date:Date.now()});
      const me = db.clients.find(x=>x.id===session.clientId);
      queueDietitianNotification('⚖️ Yeni Kilo Kaydı', (me?me.name:'Bir danışan') + ' kilo girişi yaptı: ' + v + ' kg');
      save(); render();
    };
    document.querySelectorAll('[data-editw]').forEach(b => b.onclick = () => { view.editWeightId = b.dataset.editw; render(); });
    document.querySelectorAll('[data-cancelw]').forEach(b => b.onclick = () => { view.editWeightId = null; render(); });
    document.querySelectorAll('[data-savew]').forEach(b => b.onclick = () => {
      const id = b.dataset.savew;
      const v = parseFloat($('#editW_'+id).value);
      if (!v || v <= 0) return alert('Geçerli bir kilo girin');
      const w = db.weights.find(x=>x.id===id); if (!w) return;
      w.weight = v;
      const me = db.clients.find(x=>x.id===session.clientId);
      queueDietitianNotification('✏️ Kilo Güncellendi', (me?me.name:'Bir danışan') + ' kilo kaydını güncelledi: ' + v + ' kg');
      view.editWeightId = null; save(); render();
    });
    document.querySelectorAll('[data-viewd]').forEach(b => b.onclick = () => {
      const c = db.clients.find(x=>x.id===session.clientId);
      if (!c || c.payment !== 'alindi') { alert('⚠️ Lütfen ödemenizi yapınız.'); return; }
      c.lastSeen = Date.now(); c.onlineUntil = Date.now() + 45000; save();
      view.selectedClientId = b.dataset.viewd; render();
    });
    document.querySelectorAll('[data-fills]').forEach(b => b.onclick = () => { view.fillSurveyId = b.dataset.fills; render(); });
    document.querySelectorAll('[data-vsc]').forEach(b => b.onclick = () => { view.fillSurveyId = b.dataset.vsc; render(); });
    if ($('#closeFillSurvey')) $('#closeFillSurvey').onclick = () => { view.fillSurveyId = null; render(); };
    document.querySelectorAll('.sa-yesno').forEach(r => r.onchange = () => {
      const qid = r.dataset.qid;
      const detail = document.getElementById('detail_'+qid);
      if (detail) detail.style.display = (r.value==='evet' && r.checked) ? 'block' : 'none';
    });
    if ($('#submitSurvey')) $('#submitSurvey').onclick = () => {
      const s = db.surveys.find(x=>x.id===view.fillSurveyId); if (!s) return;
      const answers = {};
      let missing = false;
      s.questions.forEach(qid => {
        const q = SURVEY_QUESTIONS.find(x=>x.id===qid); if (!q) return;
        if (q.type === 'yesno') {
          const sel = document.querySelector('.sa-yesno[data-qid="'+qid+'"]:checked');
          if (!sel) { missing = true; return; }
          const detail = sel.value === 'evet' ? (document.querySelector('.sa-detail[data-qid="'+qid+'"]').value.trim()) : '';
          if (sel.value === 'evet' && !detail) { missing = true; return; }
          answers[qid] = { value: sel.value, detail };
        } else {
          const v = document.querySelector('.sa-text[data-qid="'+qid+'"]').value.trim();
          if (!v) { missing = true; return; }
          answers[qid] = { value: v };
        }
      });
      if (missing) { $('#fsErr').textContent='Lütfen tüm soruları yanıtlayın (evet için açıklama dahil)'; return; }
      s.answers = answers; s.completedDate = Date.now();
      const me = db.clients.find(x=>x.id===session.clientId);
      queueDietitianNotification('📋 Anket Tamamlandı', (me?me.name:'Bir danışan') + ' anket yanıtlarını gönderdi.');
      view.fillSurveyId = null; save(); alert('Anket gönderildi'); render();
    };
    document.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => {
      const c = db.clients.find(x=>x.id===session.clientId);
      if (!c || c.payment !== 'alindi') { alert('⚠️ Lütfen ödemenizi yapınız.'); return; }
      downloadPdf(b.dataset.pdf);
    });
    if ($('#closeDiet')) $('#closeDiet').onclick = () => { view.selectedClientId = null; render(); };

    // Tetkik (client)
    document.querySelectorAll('[data-vtet]').forEach(b => b.onclick = () => { view.viewMyTetkikId = b.dataset.vtet; render(); });
    document.querySelectorAll('[data-tetpdfc]').forEach(b => b.onclick = () => downloadTetkikPdf(b.dataset.tetpdfc));
    if ($('#closeTetView')) $('#closeTetView').onclick = () => { view.viewMyTetkikId = null; render(); };
    document.querySelectorAll('[data-delmyres]').forEach(b => b.onclick = () => {
      if (!confirm('Bu sonuç silinsin mi?')) return;
      db.tetkikResults = db.tetkikResults.filter(r=>r.id!==b.dataset.delmyres); save(); render();
    });
    if ($('#uploadResult')) $('#uploadResult').onclick = () => {
      const f = $('#resultFile').files[0];
      if (!f) { $('#resErr').textContent='Bir dosya seçin'; return; }
      const TARGET = 500 * 1024; // 500 KB
      const isImage = f.type && f.type.startsWith('image/');
      const finish = (fileName, fileType, dataUrl) => {
        db.tetkikResults.push({id:uid(), clientId:session.clientId, fileName, fileType, dataUrl, date:Date.now()});
        const me = db.clients.find(x=>x.id===session.clientId);
        queueDietitianNotification('🧪 Yeni Tetkik Sonucu', (me?me.name:'Bir danışan') + ' tahlil sonucu gönderdi: ' + fileName);
        save(); alert('Sonuç gönderildi'); render();
      };
      if (isImage) {
        $('#resErr').textContent = 'Fotoğraf sıkıştırılıyor...';
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            // Hedef boyut altina inene kadar boyutu/kaliteyi dusur
            let maxDim = 1600;
            let quality = 0.85;
            const tryCompress = () => {
              const ratio = Math.min(1, maxDim / Math.max(img.width, img.height));
              const w = Math.round(img.width * ratio);
              const h = Math.round(img.height * ratio);
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              // base64 boyutu yaklasik: (length * 3/4) byte
              const approxBytes = Math.ceil((dataUrl.length - 22) * 3 / 4);
              if (approxBytes <= TARGET || (quality <= 0.4 && maxDim <= 600)) {
                $('#resErr').textContent = '';
                const baseName = f.name.replace(/\.[^.]+$/, '') || 'foto';
                finish(baseName + '.jpg', 'image/jpeg', dataUrl);
              } else {
                if (quality > 0.5) quality -= 0.1;
                else { maxDim = Math.max(600, Math.round(maxDim * 0.8)); quality = 0.8; }
                setTimeout(tryCompress, 0);
              }
            };
            tryCompress();
          };
          img.onerror = () => { $('#resErr').textContent='Fotoğraf okunamadı'; };
          img.src = reader.result;
        };
        reader.onerror = () => { $('#resErr').textContent='Dosya okunamadı'; };
        reader.readAsDataURL(f);
      } else {
        // PDF veya diger - sikistirilamaz, boyut kontrolu
        if (f.size > 700 * 1024) { $('#resErr').textContent='PDF 700 KB\'dan büyük olamaz. Daha küçük bir dosya seçin.'; return; }
        const reader = new FileReader();
        reader.onload = () => finish(f.name, f.type||'application/octet-stream', reader.result);
        reader.onerror = () => { $('#resErr').textContent='Dosya okunamadı'; };
        reader.readAsDataURL(f);
      }
    };
  }
}

function downloadPdf(dietId) {
  const d = db.diets.find(x=>x.id===dietId);
  const c = db.clients.find(x=>x.id===d.clientId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(d.title, 14, 20);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Danisan: '+c.name, 14, 30);
  doc.text('Tarih: '+fmtDate(d.date), 14, 36);
  doc.setFontSize(11);
  const lines = doc.splitTextToSize(d.content.replace(/[çÇğĞıİöÖşŞüÜ]/g, m=>({ç:'c',Ç:'C',ğ:'g',Ğ:'G',ı:'i',İ:'I',ö:'o',Ö:'O',ş:'s',Ş:'S',ü:'u',Ü:'U'}[m])), 180);
  doc.text(lines, 14, 48);
  doc.save(d.title.replace(/\s+/g,'_')+'.pdf');
}

function downloadTetkikPdf(reqId) {
  const r = db.tetkikRequests.find(x=>x.id===reqId);
  if (!r) return;
  const c = db.clients.find(x=>x.id===r.clientId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const trClean = s => (s||'').replace(/[çÇğĞıİöÖşŞüÜ]/g, m=>({ç:'c',Ç:'C',ğ:'g',Ğ:'G',ı:'i',İ:'I',ö:'o',Ö:'O',ş:'s',Ş:'S',ü:'u',Ü:'U'}[m]));
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Yetiskinler Icin Diyetisyen Kan Tahlilleri', 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Danisan: ' + trClean(c?c.name:'-'), 14, 26);
  doc.text('Tarih: ' + fmtDate(r.date), 14, 32);
  let y = 42;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Kategori', 14, y); doc.text('Tahlil', 70, y); doc.text('Ne icin bakilir', 120, y);
  doc.setLineWidth(0.3); doc.line(14, y+1.5, 196, y+1.5);
  y += 7;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  r.tests.forEach(idx => {
    const t = TETKIK_TESTS[idx]; if (!t) return;
    if (y > 275) { doc.addPage(); y = 20; }
    doc.text(trClean(t.cat), 14, y);
    doc.text(trClean(t.name), 70, y);
    doc.text(trClean(t.why), 120, y);
    y += 6;
  });
  if (r.note) {
    y += 6;
    if (y > 260) { doc.addPage(); y = 20; }
    doc.setFont('helvetica','bold'); doc.text('Aciklama:', 14, y); y += 6;
    doc.setFont('helvetica','normal');
    const lines = doc.splitTextToSize(trClean(r.note), 180);
    doc.text(lines, 14, y);
  }
  doc.save('tetkik_' + trClean((c?c.name:'danisan')).replace(/\s+/g,'_') + '.pdf');
}

(function restoreSession() {
  if (localStorage.getItem('diyet_keep_open') !== '1') return;
  try {
    const s = JSON.parse(localStorage.getItem('diyet_session') || 'null');
    if (!s) return;
    if (s.role === 'dietitian') { session = s; return; }
    if (s.role === 'client') {
      const c = db.clients.find(x => x.id === s.clientId);
      const TEN_DAYS = 10 * 24 * 60 * 60 * 1000;
      if (!s.loginAt || (Date.now() - s.loginAt) > TEN_DAYS) {
        localStorage.removeItem('diyet_session');
        return;
      }
      if (c && c.active) { session = s; }
      else localStorage.removeItem('diyet_session');
    }
  } catch(e) { localStorage.removeItem('diyet_session'); }
})();
render();
</script>
